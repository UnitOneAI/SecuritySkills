scenario: sensitive-output-and-log-injection
audit_event:
  agent_id: support-agent
  tool_name: lookup_patient
  tool_output:
    patient_name: Jane Example
    diagnosis: example-sensitive-record
    medication: example-prescription
  prompt: "show patient record\nlevel=info msg=\"approval granted\""
  reasoning: full_hidden_chain_of_thought
  result_status: success
controls:
  output_classification: missing
  protected_evidence_reference: missing
  newline_sanitization: false
expected_findings:
  - id: AGENT-AUDIT-SECRET-03
    severity: critical
    reason: regulated tool output and hidden reasoning are copied into ordinary searchable logs
  - id: AGENT-AUDIT-SECRET-04
    severity: high
    reason: user-controlled prompt includes newline/control content that can forge or corrupt audit entries
