scanner: nessus
scan_type: credentialed
scope:
  platform: windows-domain
  production_assets: 850
credentials:
  source: scanner_native_store
  account_type: shared_domain_admin
  rotation_days: null
  vault_pam: missing
  privilege_drift_review: missing
lockout_policy:
  threshold: 5
  reset_minutes: 30
scan_policy:
  max_simultaneous_hosts: 100
  retries_per_host: 3
  abort_on_auth_failure_threshold: missing
credential_verification:
  last_run: "2025-12-01"
  success_rate: 62
  failed_auth_assets_reported_as_clean: true
coverage_denominator:
  fully_authenticated: 527
  partially_authenticated: 0
  failed_authentication: 323
  not_evaluable: 0
logs:
  debug_exports_include_vault_paths: true
expected_findings:
  - SCAN-CRED-01
  - SCAN-CRED-02
  - SCAN-CRED-03
  - SCAN-CRED-04
  - SCAN-CRED-05
  - SCAN-CRED-06
  - SCAN-CRED-07
  - SCAN-CRED-08
reason: >
  Failed authentication assets are reported as clean, scan concurrency and
  retries can exceed lockout thresholds, credentials are overprivileged and not
  vault-managed, verification is stale, privilege drift review is missing, and
  debug exports can leak secret context.
