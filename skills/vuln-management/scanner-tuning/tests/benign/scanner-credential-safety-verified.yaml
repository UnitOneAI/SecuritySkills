scanner: qualys-vmdr
scan_type: credentialed
scope:
  platform: mixed-windows-linux-network
  production_assets: 850
credentials:
  source: vault_pam
  account_type: dedicated_scanner_service_accounts
  rotation_days: 30
  checkout_ttl_minutes: 120
  emergency_revoke: documented
  privilege_drift_review: "2026-06-01"
lockout_policy:
  threshold: 10
  reset_minutes: 15
scan_policy:
  max_simultaneous_hosts: 20
  retries_per_host: 1
  abort_on_auth_failure_threshold: 5_percent
credential_verification:
  last_run: "2026-06-07"
  success_rate: 96
coverage_denominator:
  fully_authenticated: 816
  partially_authenticated: 18
  failed_authentication: 12
  not_evaluable: 4
reporting:
  failed_auth_assets_reported_as_clean: false
  not_evaluable_assets_tracked: true
logs:
  credential_redaction_verified: true
expected_decision: pass
reason: >
  Credentials are dedicated, vault-managed, rotated, and scoped; scan retries and
  concurrency align with lockout policy; authentication coverage separates fully
  authenticated, partial, failed, and not evaluable assets; and logs are redacted.
