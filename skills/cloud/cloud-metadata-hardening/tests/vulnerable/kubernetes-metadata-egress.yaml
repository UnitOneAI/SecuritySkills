apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-api
  namespace: production
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-api
  template:
    metadata:
      labels:
        app: public-api
    spec:
      serviceAccountName: public-api
      containers:
        - name: api
          image: example/public-api:1.0.0
          env:
            - name: URL_PREVIEW_ENABLED
              value: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: public-api
  policyTypes:
    - Egress
  egress:
    - {}
