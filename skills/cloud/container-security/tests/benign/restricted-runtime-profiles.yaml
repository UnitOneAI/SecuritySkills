apiVersion: apps/v1
kind: Deployment
metadata:
  name: restricted-runtime-profile
spec:
  selector:
    matchLabels:
      app: restricted-runtime-profile
  template:
    metadata:
      labels:
        app: restricted-runtime-profile
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            appArmorProfile:
              type: RuntimeDefault
