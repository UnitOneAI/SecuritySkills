apiVersion: v1
kind: Pod
metadata:
  name: checkout-api
  namespace: production
spec:
  containers:
    - name: app
      image: registry.example.com/checkout-api@sha256:3333333333333333333333333333333333333333333333333333333333333333
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  ephemeralContainers:
    - name: node-debug
      image: busybox:1.36
      targetContainerName: app
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
        capabilities:
          add: ["SYS_ADMIN"]
