apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-web
  namespace: frontend
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web
  namespace: frontend
spec:
  selector:
    matchLabels:
      app: public-web
  template:
    metadata:
      labels:
        app: public-web
    spec:
      serviceAccountName: public-web
      automountServiceAccountToken: false
      containers:
        - name: web
          image: example/web:1.0.0
