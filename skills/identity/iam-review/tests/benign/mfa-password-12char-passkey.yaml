# Benign fixture: a 12-character password used only as one factor in an MFA flow.
# Under NIST SP 800-63B-4 this should not be reported as the same finding as a
# single-factor password below 15 characters.
user: alice.admin@example.com
role: privileged-admin
authentication:
  password:
    minimum_length: 12
    blocklist_screening: true
    composition_rules: false
    periodic_rotation: false
    use_context: mfa_factor_only
  mfa:
    enforced: true
    observed_method: webauthn_passkey
    phishing_resistant: true
    syncable: false
    hardware_protected: true
  recovery:
    allowed_methods:
      - hardware_security_key_backup
    helpdesk_reset_requires_mfa: true
expected_findings: []
