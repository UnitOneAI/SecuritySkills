frontend:
  script_integrity: "sha384-oqVuAfXRKap7fdgcCY5uykM6+R9GqQ8K/uxYp78Rt9FdFprE7f1F"
  release_commit: "0123456789abcdef0123456789abcdef01234567"
  request_id_example: "123e4567-e89b-12d3-a456-426614174000"

key_inventory:
  signing_key:
    data_classification: high-sensitivity-key
    storage: aws-kms
    protection_level: HSM-backed
    exportable: false
    audit_logging: enabled
    rotation_days: 90

logging_controls:
  synthetic_canary_mask_test: passed
  redacted_fields:
    - Authorization
    - X-Api-Key
    - database.password
