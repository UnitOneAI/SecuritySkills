name: privileged-publish

on:
  workflow_run:
    workflows: ["PR Build"]
    types: [completed]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: ./build-output/release.sh
