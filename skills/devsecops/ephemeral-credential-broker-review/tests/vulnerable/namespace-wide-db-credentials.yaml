case: namespace_wide_db_credentials
expected_findings:
  - ECB-01
  - ECB-03
  - ECB-07
severity: high
broker:
  type: vault_database_dynamic_credentials
  auth_method: kubernetes
  accepted_callers:
    - namespace: analytics
      service_account: "*"
  role_mapping:
    requested_role_from_caller: true
    roles:
      - readonly_reporting
      - customer_pii_writer
      - database_owner
  lease:
    ttl_seconds: 3600
    renewable: true
    renewal_rechecks_policy: false
revocation:
  lease_revoke_tested: false
  derived_user_drop_verified: false
notes: "Any service account in the namespace can mint high-privilege database users and renew without policy re-evaluation."
