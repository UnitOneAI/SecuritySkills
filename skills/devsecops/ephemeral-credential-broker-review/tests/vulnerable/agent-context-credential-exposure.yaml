case: agent_context_credential_exposure
expected_findings:
  - ECB-04
  - ECB-08
severity: critical
broker:
  type: internal_agent_tool_credential_broker
  caller_identity: shared_human_browser_session
  issued_credential_type: temporary_api_token
  lease:
    ttl_seconds: 7200
agent_runtime:
  stores_tool_results_in_long_term_memory: true
  logs_full_tool_parameters: true
  exposes_credential_to_model_context: true
  redaction_before_memory_write: false
audit:
  logs_agent_id: false
  logs_human_session_owner_only: true
notes: "The broker issues real tool credentials through a shared human session and leaks values into logs and long-term agent memory."
